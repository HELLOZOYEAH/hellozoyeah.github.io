<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>โดเนท</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fff6fa; --card:#fff; --ink:#3a2b33; --muted:#8a7480; --accent:#e85d9a; --line:#f0d9e4; --ok:#2e9d5b; --bad:#d64545; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Kanit, sans-serif; }
  main { max-width:460px; margin:0 auto; padding:24px 16px 48px; }
  h1 { text-align:center; margin:8px 0 20px; font-size:26px; }
  h1 span { color:var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:16px; }
  .step { font-weight:600; margin-bottom:10px; }
  label { display:block; font-size:14px; color:var(--muted); margin:10px 0 4px; }
  input, textarea { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font:inherit; background:#fff; color:var(--ink); }
  textarea { resize:vertical; min-height:70px; }
  .quick { display:flex; gap:8px; margin-top:8px; }
  .quick button { flex:1; padding:8px; border:1px solid var(--accent); background:#fff; color:var(--accent); border-radius:10px; font:inherit; cursor:pointer; }
  #qr { display:flex; justify-content:center; margin:14px 0 6px; }
  #qr svg { width:220px; height:220px; }
  .center { text-align:center; color:var(--muted); font-size:14px; }
  .drop { display:block; border:2px dashed var(--line); border-radius:12px; padding:20px; text-align:center; color:var(--muted); cursor:pointer; }
  .drop img { max-width:100%; max-height:220px; border-radius:8px; }
  #send { width:100%; padding:14px; border:0; border-radius:12px; background:var(--accent); color:#fff; font:600 18px Kanit, sans-serif; cursor:pointer; }
  #send:disabled { opacity:.5; cursor:default; }
  #msg { margin-top:12px; text-align:center; min-height:1.4em; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
</style>
</head>
<body>
<main>
  <h1>โดเนทให้ <span id="ch"></span></h1>

  <div class="card">
    <div class="step">1. ชื่อและข้อความ</div>
    <label for="name">ชื่อของคุณ</label>
    <input id="name" maxlength="40">
    <label for="text">ข้อความ</label>
    <textarea id="text" maxlength="255"></textarea>
  </div>

  <div class="card">
    <div class="step">2. ใส่ยอดแล้วสแกนโอนผ่านพร้อมเพย์</div>
    <label for="amount">จำนวนเงิน (บาท)</label>
    <input id="amount" type="number" inputmode="decimal" step="1">
    <div class="quick" id="quick"></div>
    <div id="qr"></div>
    <div class="center">สแกนด้วยแอปธนาคาร ยอดเงินจะขึ้นให้อัตโนมัติ</div>
  </div>

  <div class="card">
    <div class="step">3. แนบสลิป</div>
    <label class="drop" id="drop">
      <input id="file" type="file" accept="image/*" hidden>
      <span id="dropText">แตะเพื่อเลือกรูปสลิป (ต้องมี QR Code บนสลิป)</span>
    </label>
  </div>

  <button id="send" disabled>ส่งโดเนท</button>
  <div id="msg"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
const C = window.DONATE_CONFIG;
const $ = id => document.getElementById(id);
const sb = supabase.createClient(C.supabaseUrl, C.supabaseAnonKey);
let slip = null; // { file, bank, transRef }

$("ch").textContent = C.channelName;
$("amount").min = C.minAmount;
$("amount").value = C.quickAmounts[0];
try { $("name").value = localStorage.getItem("donate-name") || ""; } catch {}
for (const a of C.quickAmounts) {
  const b = document.createElement("button");
  b.textContent = a; b.onclick = () => { $("amount").value = a; drawQr(); };
  $("quick").appendChild(b);
}

function drawQr() {
  const amt = Number($("amount").value);
  const q = qrcode(0, "M");
  q.addData(promptpayPayload(C.promptpay, amt >= C.minAmount ? amt : 0));
  q.make();
  $("qr").innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
}
$("amount").oninput = drawQr;
drawQr();

function say(t, cls) { $("msg").textContent = t; $("msg").className = cls || ""; }

// อ่าน QR จากรูป ลองหลายขนาดเพราะ QR บนสลิปมีขนาดเล็ก
async function readQr(file) {
  const img = await createImageBitmap(file);
  for (const w of [img.width, 1600, 1000, 700]) {
    const s = Math.min(1, w / img.width);
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    const g = c.getContext("2d");
    g.drawImage(img, 0, 0, c.width, c.height);
    const r = jsQR(g.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: "attemptBoth" });
    if (r) return r.data;
  }
  return null;
}

$("file").onchange = async () => {
  const file = $("file").files[0];
  slip = null; $("send").disabled = true;
  if (!file) return;
  $("dropText").innerHTML = "";
  const im = document.createElement("img");
  im.src = URL.createObjectURL(file);
  $("dropText").appendChild(im);
  say("กำลังตรวจสลิป…");
  const info = parseSlipQr(await readQr(file).catch(() => null));
  if (!info) return say("ไม่พบ QR ตรวจสอบสลิปในรูปนี้ กรุณาใช้สลิปจากแอปธนาคารที่มี QR", "bad");
  slip = { file, ...info };
  say(`พบสลิป ${BANKS[info.bank] || "ธนาคาร " + info.bank} ✓`, "ok");
  $("send").disabled = false;
};

$("send").onclick = async () => {
  const name = $("name").value.trim() || "ไม่ระบุชื่อ";
  const amount = Number($("amount").value);
  if (!(amount >= C.minAmount)) return say(`โดเนทขั้นต่ำ ${C.minAmount} บาท`, "bad");
  if (!slip) return;
  $("send").disabled = true;
  say("กำลังส่ง…");
  try { localStorage.setItem("donate-name", $("name").value.trim()); } catch {}
  const ext = (slip.file.type.split("/")[1] || "jpg").replace("jpeg", "jpg");
  const path = `${new Date().toISOString().slice(0, 10)}/${slip.transRef}.${ext}`;
  const { error } = await sb.from("slips").insert({
    trans_ref: slip.transRef, bank: slip.bank, name, amount,
    message: $("text").value.trim(), slip_path: path,
  });
  if (error) {
    $("send").disabled = false;
    return say(error.code === "23505" ? "สลิปนี้ถูกใช้ไปแล้ว" : "ส่งไม่สำเร็จ ลองใหม่อีกครั้ง", "bad");
  }
  await sb.storage.from("slips").upload(path, slip.file, { upsert: false }).catch(() => {});
  say("ขอบคุณสำหรับโดเนท! 💖", "ok");
  slip = null; $("file").value = "";
  $("dropText").textContent = "แตะเพื่อเลือกรูปสลิป (ต้องมี QR Code บนสลิป)";
  $("text").value = "";
};
</script>
</body>
</html>
