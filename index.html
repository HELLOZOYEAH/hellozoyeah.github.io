<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b0d">
<title>โดเนท</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@900&family=Bai+Jamjuree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0b0d; --panel:#141416; --card:#191919; --line:#252525; --field:#0f0f11; --field-line:#2f2f35;
          --ink:#ececec; --muted:#9a9aa3; --dim:#7d7d86; --accent:#b9a6ff; --accent-deep:#221d33; --accent-line:#3a3350;
          --ok:#a8f0c6; --bad:#ff9a9a; }
  * { box-sizing:border-box; }
  html { background:var(--bg); }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Bai Jamjuree", sans-serif; -webkit-font-smoothing:antialiased; }
  main { max-width:460px; margin:0 auto; padding:24px 16px 48px; display:flex; flex-direction:column; gap:16px; }
  .dots { font-family:Doto, monospace; font-weight:900; }

  .top { display:flex; justify-content:space-between; align-items:center; }
  .brand { font-size:15px; letter-spacing:3px; color:var(--accent); }
  .air { display:flex; align-items:center; gap:8px; border:1px solid var(--accent-line); border-radius:999px; padding:5px 12px; font-size:13px; letter-spacing:2px; color:var(--accent); }
  .air i { width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); animation:pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.35; } }

  .hero { background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:26px 18px 22px; display:flex; flex-direction:column; align-items:center; gap:16px; }
  #face { display:grid; grid-template-columns:repeat(15, 9px); gap:4px; }
  #face b { width:9px; height:9px; border-radius:50%; background:#1f1d26; }
  #face b.on { background:var(--accent); box-shadow:0 0 6px rgba(185,166,255,.8); }
  .hero p { margin:0; font-size:13px; color:var(--muted); text-align:center; }
  h1 { margin:4px 0 0; font-size:34px; letter-spacing:1px; color:#fff; text-align:center; overflow-wrap:anywhere; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:10px; }
  .step { display:flex; align-items:center; gap:10px; font-weight:600; font-size:16px; }
  .step .dots { font-size:20px; color:var(--accent); }
  label { font-size:13px; color:var(--muted); }
  input, textarea { width:100%; background:var(--field); border:1px solid var(--field-line); border-radius:12px; color:var(--ink); font:inherit; font-size:16px; }
  input { height:46px; padding:0 14px; }
  textarea { min-height:88px; padding:12px 14px; resize:vertical; }
  input:focus, textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(185,166,255,.18); }
  ::placeholder { color:#5f5f68; }

  .big { display:flex; align-items:baseline; justify-content:center; gap:8px; padding:6px 0; }
  #big { font-size:64px; line-height:1; color:#fff; text-shadow:0 0 18px rgba(185,166,255,.45); }
  .big span { font-size:18px; color:var(--muted); }
  .quick { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:8px; }
  .quick button { height:46px; border-radius:12px; border:1px solid var(--field-line); background:var(--field); color:var(--ink); font-size:18px; cursor:pointer; }
  .quick button.on { border-color:var(--accent); background:var(--accent-deep); color:#fff; }
  .qrbox { align-self:center; background:#fff; border-radius:16px; padding:12px; box-shadow:0 0 0 1px var(--accent-line), 0 0 30px rgba(185,166,255,.25); }
  #qr svg { display:block; width:210px; height:210px; }
  .hint { text-align:center; font-size:13px; color:var(--muted); }

  .drop { display:flex; flex-direction:column; align-items:center; gap:8px; border:1.5px dashed var(--accent-line); border-radius:14px; padding:24px 16px; color:var(--muted); font-size:14px; text-align:center; cursor:pointer; }
  .drop img { max-width:100%; max-height:240px; border-radius:10px; }

  #send { height:56px; border:0; border-radius:16px; background:var(--accent); color:#120f1c; font:600 18px "Bai Jamjuree", sans-serif; cursor:pointer; box-shadow:0 0 24px rgba(185,166,255,.35); }
  #send:disabled { background:#2a2733; color:#7d7a88; box-shadow:none; cursor:default; }
  #msg { min-height:1.4em; text-align:center; font-size:14px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  .foot { text-align:center; font-size:12px; color:var(--dim); }
  button:focus-visible, .drop:focus-within { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="dots brand">ACE·DONO</div>
    <div class="dots air"><i></i>ON AIR</div>
  </div>

  <div class="hero">
    <div id="face" aria-hidden="true"></div>
    <div>
      <p>ส่งข้อความให้ ACE อ่านบนสตรีม</p>
      <h1 class="dots" id="ch"></h1>
    </div>
  </div>

  <section class="card">
    <div class="step"><span class="dots">01</span>ชื่อและข้อความ</div>
    <label for="name">ชื่อที่ให้ ACE อ่าน</label>
    <input id="name" maxlength="40" placeholder="เช่น KluayTod_99" autocomplete="nickname">
    <label for="text">ข้อความ (ไม่เกิน 255 ตัว)</label>
    <textarea id="text" maxlength="255" placeholder="ACE วันนี้กินข้าวหรือยัง"></textarea>
  </section>

  <section class="card">
    <div class="step"><span class="dots">02</span>เลือกยอดแล้วสแกนพร้อมเพย์</div>
    <div class="big"><div class="dots" id="big">0</div><span>บาท</span></div>
    <div class="quick" id="quick"></div>
    <label for="amount" id="amountLabel">หรือใส่ยอดเอง</label>
    <input id="amount" type="number" inputmode="decimal" step="1">
    <div class="qrbox"><div id="qr"></div></div>
    <div class="hint">สแกนด้วยแอปธนาคาร ยอดขึ้นให้เอง ไม่ต้องพิมพ์</div>
  </section>

  <section class="card">
    <div class="step"><span class="dots">03</span>แนบสลิป</div>
    <label class="drop" id="drop">
      <input id="file" type="file" accept="image/*" hidden>
      <span id="dropText"></span>
    </label>
  </section>

  <button id="send" disabled>ส่งโดเนทให้ ACE</button>
  <div id="msg" role="status" aria-live="polite"></div>
  <div class="foot">ชื่อ ยอด และข้อความจะขึ้นบนสตรีม · รูปสลิปเห็นเฉพาะเจ้าของช่อง</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
const C = window.DONATE_CONFIG;
const $ = id => document.getElementById(id);
const sb = supabase.createClient(C.supabaseUrl, C.supabaseAnonKey);
let slip = null; // { file, bank, transRef }

// หน้า ACE แบบจุด (ตกแต่ง)
const FACE = ["...............", "..XXX.....XXX..", ".X...X...X...X.", "...............", ".....X...X.....", "......XXX......", "..............."];
for (const ch of FACE.join("")) { const d = document.createElement("b"); if (ch === "X") d.className = "on"; $("face").appendChild(d); }

const DROP_HINT = `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#b9a6ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg><br>แตะเพื่อเลือกรูปสลิป · ต้องมี QR บนสลิป`;
function resetDrop() { $("dropText").innerHTML = DROP_HINT; }
resetDrop();

$("ch").textContent = C.channelName;
$("amount").min = C.minAmount;
$("amount").value = C.quickAmounts[0];
$("amountLabel").textContent = `หรือใส่ยอดเอง (ขั้นต่ำ ${C.minAmount} บาท)`;
try { $("name").value = localStorage.getItem("donate-name") || ""; } catch {}
for (const a of C.quickAmounts) {
  const b = document.createElement("button");
  b.className = "dots"; b.type = "button"; b.textContent = a; b.dataset.amount = a;
  b.onclick = () => { $("amount").value = a; drawQr(); };
  $("quick").appendChild(b);
}

function drawQr() {
  const amt = Number($("amount").value);
  const ok = amt >= C.minAmount;
  $("big").textContent = ok ? amt.toLocaleString("th-TH", { maximumFractionDigits: 2 }) : "–";
  for (const b of $("quick").children) b.classList.toggle("on", Number(b.dataset.amount) === amt);
  const q = qrcode(0, "M");
  q.addData(promptpayPayload(C.promptpay, ok ? amt : 0));
  q.make();
  $("qr").innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
}
$("amount").oninput = drawQr;
drawQr();

function say(t, cls) { $("msg").textContent = t; $("msg").className = cls || ""; }

// อ่าน QR จากรูป ลองหลายขนาดเพราะ QR บนสลิปมีขนาดเล็ก
async function readQr(file) {
  const img = await createImageBitmap(file);
  for (const w of [img.width, 1600, 1000, 700]) {
    const s = Math.min(1, w / img.width);
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    const g = c.getContext("2d");
    g.drawImage(img, 0, 0, c.width, c.height);
    const r = jsQR(g.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: "attemptBoth" });
    if (r) return r.data;
  }
  return null;
}

$("file").onchange = async () => {
  const file = $("file").files[0];
  slip = null; $("send").disabled = true;
  if (!file) return;
  $("dropText").innerHTML = "";
  const im = document.createElement("img");
  im.src = URL.createObjectURL(file);
  im.alt = "รูปสลิปที่เลือก";
  $("dropText").appendChild(im);
  say("กำลังตรวจสลิป…");
  const info = parseSlipQr(await readQr(file).catch(() => null));
  if (!info) return say("ไม่พบ QR ตรวจสอบสลิปในรูปนี้ กรุณาใช้สลิปจากแอปธนาคารที่มี QR", "bad");
  slip = { file, ...info };
  say(`พบสลิป ${BANKS[info.bank] || "ธนาคาร " + info.bank} ✓`, "ok");
  $("send").disabled = false;
};

$("send").onclick = async () => {
  const name = $("name").value.trim() || "ไม่ระบุชื่อ";
  const amount = Number($("amount").value);
  if (!(amount >= C.minAmount)) return say(`โดเนทขั้นต่ำ ${C.minAmount} บาท`, "bad");
  if (!slip) return;
  $("send").disabled = true;
  say("กำลังส่ง…");
  try { localStorage.setItem("donate-name", $("name").value.trim()); } catch {}
  const ext = (slip.file.type.split("/")[1] || "jpg").replace("jpeg", "jpg");
  const path = `${new Date().toISOString().slice(0, 10)}/${slip.transRef}.${ext}`;
  const { error } = await sb.from("slips").insert({
    trans_ref: slip.transRef, bank: slip.bank, name, amount,
    message: $("text").value.trim(), slip_path: path,
  });
  if (error) {
    $("send").disabled = false;
    return say(error.code === "23505" ? "สลิปนี้ถูกใช้ไปแล้ว" : "ส่งไม่สำเร็จ ลองใหม่อีกครั้ง", "bad");
  }
  await sb.storage.from("slips").upload(path, slip.file, { upsert: false }).catch(() => {});
  say("ส่งแล้ว! รอฟัง ACE อ่านบนสตรีมได้เลย 💜", "ok");
  slip = null; $("file").value = "";
  resetDrop();
  $("text").value = "";
};
</script>
</body>
</html>
