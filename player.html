<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ACE · คลิป</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe, #clip { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<!-- ACEACE plays a donor's YouTube or TikTok clip on ACE's TV through this page: YouTube refuses embeds on a page
     served from 127.0.0.1 (error 153), but accepts this https site. The page tells ACE's TV (window.parent) when the
     clip itself starts and ends, after any YouTube ad, so the donor's seconds are counted from the real start.
     Usage: player.html#v=<id>&start=<s>&end=<s>[&mute=1]   ·   TikTok: player.html#site=tiktok&v=<id>&start=<s>&end=<s>[&mute=1] -->
<div id="clip"></div>
<script>
(function () {
  var q = new URLSearchParams(location.hash.slice(1));
  var tiktok = q.get('site') === 'tiktok';
  var id = q.get('v') || '';
  if (!(tiktok ? /^[0-9]{8,25}$/ : /^[A-Za-z0-9_-]{11}$/).test(id)) return;
  var whole = function (v) { v = parseInt(v, 10); return isFinite(v) && v >= 0 && v <= 21600 ? v : 0; };
  var start = whole(q.get('start')), end = whole(q.get('end')), mute = q.get('mute') === '1';
  var told = {};
  // a clip shorter than its seconds (a 12 s TikTok on a 30 s slot) plays again from its start until they are used;
  // the seconds count only while it actually plays, so loading and ads never eat them (2026-10-13)
  var length = end > start ? end - start : 0, played = 0, last = null;
  var count = function (now) {  // now: the video's own time; a jump (seek, loop, ad) is not counted
    if (last !== null && now > last && now - last < 1.5) played += now - last;
    last = now;
    return length && played >= length;
  };
  var tell = function (what) {  // 'started' | 'ended' | 'failed', once each
    if (told[what] || window.parent === window) return;
    told[what] = true;
    window.parent.postMessage({ aceClip: what }, '*');
  };

  if (tiktok) {
    var frame = document.createElement('iframe');
    frame.title = '\u0e04\u0e25\u0e34\u0e1b\u0e08\u0e32\u0e01\u0e04\u0e19\u0e42\u0e14\u0e40\u0e19\u0e15';
    frame.allow = 'autoplay; encrypted-media; fullscreen';
    frame.referrerPolicy = 'strict-origin-when-cross-origin';
    frame.src = 'https://www.tiktok.com/player/v1/' + id + '?autoplay=1&controls=0&progress_bar=0&play_button=0&volume_control=0'
      + '&fullscreen_button=0&timestamp=0&loop=0&music_info=0&description=0&rel=0&native_context_menu=0&closed_caption=0'
      + (mute ? '&muted=1' : '');
    document.getElementById('clip').replaceWith(frame);
    var send = function (type, value) {
      var message = { 'x-tiktok-player': true, type: type };
      if (value !== undefined) message.value = value;
      frame.contentWindow.postMessage(message, 'https://www.tiktok.com');
    };
    var asked = 0, placed = false;
    var unmute = function () { if (!mute && asked++ < 4) send('unMute'); };  // a few tries, never a loop
    // TikTok's player takes commands by postMessage once ready, and reports its state and time the same way
    window.addEventListener('message', function (event) {
      if (event.origin !== 'https://www.tiktok.com' || !event.data) return;
      var type = event.data.type, value = event.data.value;
      // autoplay starts muted in embedded players; ACE's TV wants the sound (Preview passes mute=1 for real donations)
      // TikTok's player remembers where it was left last time (same video): always jump to the clip's start
      if (type === 'onPlayerReady') { send('seekTo', start); send('play'); unmute(); }
      else if (type === 'onStateChange' && value === 1) { unmute(); tell('started'); }
      else if (type === 'onMute' && value === true) unmute();
      else if (type === 'onStateChange' && value === 0) {
        if (length && played < length - 1) { last = null; send('seekTo', start); send('play'); }  // again from its start
        else tell('ended');
      }
      else if (type === 'onPlayerError') {
        var code = value && value.errorCode;
        // 3002: the browser blocked playing with sound; play on muted rather than lose the clip
        if (code === 3002) { asked = 99; send('mute'); send('play'); }
        else tell('failed');  // deleted, private, not embeddable, or a browser that cannot play it
      }
      else if (type === 'onCurrentTime' && value) {
        var now = value.currentTime;
        if (!placed) { placed = true; if (Math.abs(now - start) > 1.5) { send('seekTo', start); return; } }  // resumed elsewhere
        if (count(now)) { send('pause'); tell('ended'); }
      }
    });
    return;
  }

  // YouTube through its IFrame API: PLAYING at the clip's own time is the clip itself (an ad runs at its own time)
  window.onYouTubeIframeAPIReady = function () {
    var player = new YT.Player('clip', {
      videoId: id, width: '100%', height: '100%',
      playerVars: { autoplay: 1, controls: 0, disablekb: 1, fs: 0, rel: 0, playsinline: 1, iv_load_policy: 3,
                    start: start, mute: mute ? 1 : 0, origin: location.origin },
      events: {
        onReady: function (e) { if (mute) e.target.mute(); e.target.playVideo(); },
        onStateChange: function (e) {
          if (e.data === YT.PlayerState.PLAYING && player.getCurrentTime() >= start - 1) tell('started');
          if (e.data === YT.PlayerState.ENDED) {
            if (length && played < length - 1) { last = null; player.seekTo(start, true); player.playVideo(); }  // a short video: again
            else tell('ended');
          }
        },
        onError: function () { tell('failed'); }
      }
    });
    // the clip's seconds, counted from the video's own clock while it plays (an ad runs on its own clock)
    setInterval(function () {
      if (told.ended || !player.getPlayerState || player.getPlayerState() !== YT.PlayerState.PLAYING) { last = null; return; }
      var now = player.getCurrentTime();
      if (now < start - 1) { last = null; return; }
      if (count(now)) { player.pauseVideo(); tell('ended'); }
    }, 250);
    var frame = player.getIframe && player.getIframe();
    if (frame) { frame.allow = 'autoplay; encrypted-media'; frame.referrerPolicy = 'strict-origin-when-cross-origin'; }
  };
  var api = document.createElement('script');
  api.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(api);
})();
</script>
</body>
</html>
